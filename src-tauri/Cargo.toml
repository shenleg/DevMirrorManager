# 单个 Rust crate：桌面宿主、权威目录和官方网络 Adapter。
[package]
name = "nodejs-downloader"
version = "0.1.0"
edition = "2021"
rust-version = "1.93.1"

[lib]
name = "nodejs_downloader"
crate-type = ["staticlib", "cdylib", "rlib"]

# CI观察命令仅用于独立冒烟构建，默认正式构建不包含测试接线。
[features]
ci-smoke = []

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.2", features = ["sync", "rt", "macros", "time"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "system-proxy"] }
semver = "=1.0.28"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
async-trait = "=0.1.92"

[dev-dependencies]
tempfile = "=3.27.0"

# 本机 macOS 27 / Apple ld 27037 下 release 宏动态库无调试信息时出现
# mis-aligned LINKEDIT；同一独立目录仅启用编译期依赖调试信息后实测通过。
# 只影响构建脚本/宏，不开启正式应用调试模式，不更换工具链或绕过签名。
[profile.release.build-override]
debug = true
